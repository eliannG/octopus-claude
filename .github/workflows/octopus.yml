# Va en el repo de GitHub como `.github/workflows/octopus.yml` (ver cloud/gh/LEEME.md).
# Se dispara cuando llega un mensaje de WhatsApp (lo pide el Worker de Cloudflare) y atiende con Claude de tu plan.
name: Octopus · Claude
on:
  repository_dispatch:
    types: [octopus]
  workflow_dispatch:

# de a una corrida por vez; si llega otro mensaje mientras tanto, lo atiende la que ya está prendida
concurrency:
  group: octopus
  cancel-in-progress: false

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Claude Code y el túnel
        run: |
          npm install -g @anthropic-ai/claude-code
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
      - name: Atender
        env:
          # la dirección la manda el propio Worker al despertar la corrida; el secreto queda de respaldo (Run workflow a mano)
          WORKER_URL: ${{ github.event.client_payload.worker || secrets.WORKER_URL }}
          OCTOPUS_API_TOKEN: ${{ secrets.OCTOPUS_API_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LINGER_SECONDS: 150
        run: node runner.mjs
